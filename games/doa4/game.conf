# Datos del juego para tools/package.sh y el instalador de la Deck.
# Obsoleto: lo sustituye doa4-linux (nativo; probado en la Deck el 2026-11-26).
# update.sh, package.sh, fetch-art.sh y serve.sh se lo saltan salvo que se nombre.
DEPRECATED=1
NAME="Dead or Alive 4"  # nombre en Steam
EXEC="dead_or_alive_4.exe"  # ejecutable, relativo a la carpeta del juego
PROTON=1  # 1 = hay que forzar Proton en Steam
STEAMGRIDDB="https://www.steamgriddb.com/game/5246968"  # https://www.steamgriddb.com/game/<n> (tools/fetch-art.sh)
SAVES='`user_data/` (partidas y caché de shaders) y `dead_or_alive_4.toml` (ajustes)'  # dónde guarda partidas y ajustes (para el README del paquete)
KEEP='user_data dead_or_alive_4.toml'  # lo que el instalador conserva al reinstalar (rutas o patrones; carpetas enteras)
KEEP_EXCLUDE='*.cat *.tpr manifest.txt'  # trajes de DOAX2 y de color: mandan los del paquete (el juego rehace los de color)
# Imágenes elegidas: id en SteamGridDB (tools/pick-art.sh)
ART_COVER=342399
ART_HEADER=342261
ART_HERO=81787
ART_LOGO=17105
ART_ICON=15569
